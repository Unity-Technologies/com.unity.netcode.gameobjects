{% metadata_file .yamato/project.metafile %} # All configuration that is used to create different configurations (used in for loops) is taken from this file.
---

# DESCRIPTION--------------------------------------------------------------------------
  # Executes project-specific tests in Unity Editor context
  # Covers both PlayMode and EditMode tests from project test assemblies
  # Excludes NGO package tests (handled in separate package test jobs)
  # Provides validation across all supported Unity Editor versions
  # Note: These tests focus on project-specific functionality, not package validation
  
# CONFIGURATION STRUCTURE--------------------------------------------------------------
  # Jobs are generated using nested loops through:
  # 1. All projects with tests (filtered by has_tests flag)
  # 2. All desktop platforms (Windows, Ubuntu, macOS)
  # 3. All supported Unity Editor versions
  # This ensures comprehensive testing across supported environments
  # Each combination creates a separate test job for parallel execution
  
# TECHNICAL CONSTRAINTS---------------------------------------------------------------
  # - Runs in Editor context only (no player builds required)
  # - No scripting backend variations needed (Editor uses Mono)
  # - Architecture variations not applicable (Editor context)
  # - Requires project packaging as prerequisite
  # - Special handling for Ubuntu display configuration
  # - Excludes performance tests for consistent CI execution
  
#------------------------------------------------------------------------------------

{% for project in projects.all -%}
{% if project.has_tests == "true" -%}
{% for platform in test_platforms.desktop -%}
{% for editor in validation_editors.all -%}
test_{{ project.name }}_{{ platform.name }}_{{ editor }}:
  name : Project Test - NGO {{ project.name }} [{{ platform.name }}, {{ editor }}]
  agent:
    type: {{ platform.type }}
    image: {{ platform.image }}
    flavor: {{ platform.flavor }}
  commands:
    - npm install upm-ci-utils@stable -g --registry https://artifactory.prd.cds.internal.unity3d.com/artifactory/api/npm/upm-npm
    - unity-downloader-cli -u {{ editor }} -c Editor --fast --wait
    - {% if platform.name == "ubuntu" %}DISPLAY=:0 && {% endif %}upm-ci project test -u {{ editor }} --project-path {{ project.path }} --type project-tests --extra-utr-arg="--extra-editor-arg=-testCategory --extra-editor-arg=!Performance --reruncount=1 --clean-library-on-rerun"
  artifacts:
    logs:
      paths:
        - "upm-ci~/test-results/**/*" # Test execution logs and results
  dependencies:
    - .yamato/project-pack.yml#project_pack_-_{{ project.name }}_{{ platform.name }} # Requires packaged project to be available
{% endfor -%}
{% endfor -%}
{% endif -%}
{% endfor -%}