{% metadata_file .yamato/project.metafile %} # All configuration that is used to create different configurations (used in for loops) is taken from this file.
---

# DESCRIPTION--------------------------------------------------------------------------
  # This job executes performance tests for NGO package.
  # TODO: Currently NGO don't have any performance tests so this job is a placeholder for the future
  # This configuration is set to not report any data (at least in current state since we don't have any tests to run)
  
# CONFIGURATION STRUCTURE--------------------------------------------------------------
  # It may seem that there is only 1 job defined, but we are using for loops based on .yamato/project.metafile configuration. Yamato "compiles" this code in order to generate jobs with multiple given configurations
  # Jobs are generated using nested loops through:
    # 1. For all desktop platforms (Windows, Ubuntu, macOS)
    # 2. For all supported Unity Editor versions (For NGOv2.X it means 6000+)
    # 3. For the default project (from project.metafile). In this case the default project (testptoject) is used as a context for the build.
  
  # In theory, we could manually write jobs for every configuration. However, this approach would be more error-prone, especially when modifications or fixes are needed, as it would require keeping track of all configurations.
  # The downside of our current approach is that it can sometimes impact readability due to the use of nested if and for statements.
  
  # The jobs name being generated would be for example "Performance editor Tests - NGO testproject [win, 6000.0] (No Data Reporting)" (name visible in Yamato) or "performance_editor_tests_-_NGO_testproject_6000.0_no_data_reporting" (job name when querying for it)  
  
# TECHNICAL CONSTRAINTS---------------------------------------------------------------
  # Tests run in Editor context only
  # No performance metrics are reported to monitoring systems
  
# QUALITY THOUGHTS--------------------------------------------------------------------
  # We should discuss how to approach the topic of performance testing
  # To see where this job is included (in trigger job definitions) look into _triggers.yml file
  
#------------------------------------------------------------------------------------

{% for platform in test_platforms.desktop -%}
{% for editor in validation_editors.all -%}
{% for project in projects.default -%}
performance_editor_tests_-_NGO_{{ platform.name }}_{{ editor }}_no_data_reporting:
  name : Performance editor Tests - NGO {{ project.name }} [{{ platform.name }}, {{ editor }}] (No Data Reporting)
  agent:
    type: {{ platform.type }}
    image: {{ platform.image }}
    flavor: {{ platform.flavor }}
  commands:
      # Installing editor
      - unity-downloader-cli -u {{ editor }} -c Editor
      
      # Build Player
      - UnifiedTestRunner --suite=editor --suite=playmode --testproject={{ project.path }} --editor-location=.Editor --timeout=3600 --artifacts-path=artifacts --extra-editor-arg=-assemblyNames --extra-editor-arg=Unity.NetCode.* --extra-editor-arg=-testCategory --extra-editor-arg=Performance --extra-editor-arg=-enablePackageManagerTraces --reruncount=1 --clean-library-on-rerun --dontreportperformancedata
  artifacts:
    logs:
      paths:
        - "artifacts/**/*"
{% endfor -%}
{% endfor -%}
{% endfor -%}